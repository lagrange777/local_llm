services:
  tailscale:
    image: tailscale/tailscale:stable@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    network_mode: service:gateway
    entrypoint: ["/bin/sh", "/scripts/start-tailnet.sh"]
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-local-llm}
      TS_EXTRA_ARGS: "--advertise-tags=tag:local-llm"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    secrets: [tailscale_auth_key]
    volumes:
      - tailnet-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
      - ./scripts/start-tailnet.sh:/scripts/start-tailnet.sh:ro
    tmpfs: ["/tmp", "/var/run"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      gateway:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped
secrets:
  tailscale_auth_key:
    file: ${TAILSCALE_AUTH_KEY_FILE:-./.secrets/tailscale_authkey}
volumes:
  tailnet-state:
