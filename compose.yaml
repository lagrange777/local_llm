name: local-llm
services:
  model-init:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    entrypoint: ["/bin/sh", "/scripts/prepare-model.sh"]
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: /models
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - models:/models
      - ./scripts/prepare-model.sh:/scripts/prepare-model.sh:ro
    networks: [bootstrap]
    restart: "no"
  ollama:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - models:/models
    networks: [runtime]
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    image: local-llm-web:local
    environment:
      WEB_ADDR: "0.0.0.0:8080"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-5m}
    networks: [runtime]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/local-llm", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  gateway:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [ingress, runtime]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  models:
networks:
  runtime:
    internal: true
  bootstrap:
  ingress:
